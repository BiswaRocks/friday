<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F.R.I.D.A.Y — Stark Industries AI</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;600;700&family=Share+Tech+Mono&display=swap');

  :root {
    --gold: #FFB700;
    --red: #C0392B;
    --cyan: #808000;
    --dark: #0A0A05;
    --panel: rgba(128, 128, 0, 0.05);
    --border: rgba(128, 128, 0, 0.3);
    --text: #C8C89A;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--dark);
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Animated grid background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(128,128,0,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(128,128,0,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  /* Radial glow */
  body::after {
    content: '';
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 80vw;
    height: 80vh;
    background: radial-gradient(ellipse, rgba(128,128,0,0.06) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 900px;
    margin: 0 auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  /* Header */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
    margin-bottom: 12px;
    flex-shrink: 0;
  }

  .logo-area {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .arc-reactor {
    width: 42px;
    height: 42px;
    position: relative;
    flex-shrink: 0;
  }

  .arc-reactor svg {
    width: 100%;
    height: 100%;
    animation: spin 8s linear infinite;
  }

  .arc-reactor-core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 14px;
    height: 14px;
    background: var(--cyan);
    border-radius: 50%;
    box-shadow: 0 0 12px var(--cyan), 0 0 24px var(--cyan);
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; box-shadow: 0 0 12px var(--cyan), 0 0 24px var(--cyan); }
    50% { opacity: 0.7; box-shadow: 0 0 6px var(--cyan), 0 0 12px var(--cyan); }
  }

  .title-block h1 {
    font-size: 22px;
    font-weight: 700;
    color: var(--cyan);
    letter-spacing: 4px;
    text-transform: uppercase;
    line-height: 1;
  }

  .title-block p {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    color: rgba(128,128,0,0.6);
    letter-spacing: 2px;
    margin-top: 3px;
  }

  .status-bar {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    color: rgba(128,128,0,0.7);
  }

  .status-dot {
    width: 7px;
    height: 7px;
    background: #00FF88;
    border-radius: 50%;
    animation: blink 1.5s ease-in-out infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  /* Chat area */
  .chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 8px 0;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  .chat-area::-webkit-scrollbar { width: 4px; }
  .chat-area::-webkit-scrollbar-track { background: transparent; }
  .chat-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  /* Messages */
  .message {
    display: flex;
    gap: 10px;
    animation: fadeIn 0.3s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .message.user {
    flex-direction: row-reverse;
  }

  .msg-avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    flex-shrink: 0;
    font-family: 'Share Tech Mono', monospace;
  }

  .message.friday .msg-avatar {
    background: rgba(0,212,255,0.15);
    border: 1px solid var(--cyan);
    color: var(--cyan);
  }

  .message.user .msg-avatar {
    background: rgba(255,183,0,0.15);
    border: 1px solid var(--gold);
    color: var(--gold);
  }

  .msg-bubble {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 2px;
    font-size: 15px;
    line-height: 1.5;
    position: relative;
  }

  .message.friday .msg-bubble {
    background: rgba(0,212,255,0.06);
    border: 1px solid rgba(0,212,255,0.2);
    border-left: 3px solid var(--cyan);
    color: #D0E8F0;
  }

  .message.user .msg-bubble {
    background: rgba(255,183,0,0.06);
    border: 1px solid rgba(255,183,0,0.2);
    border-right: 3px solid var(--gold);
    color: #F0E0B0;
    text-align: right;
  }

  .msg-label {
    font-family: 'Share Tech Mono', monospace;
    font-size: 9px;
    letter-spacing: 2px;
    margin-bottom: 4px;
    opacity: 0.5;
    text-transform: uppercase;
  }

  /* Thinking indicator */
  .thinking {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 10px 14px;
    background: rgba(0,212,255,0.06);
    border: 1px solid rgba(0,212,255,0.2);
    border-left: 3px solid var(--cyan);
    border-radius: 2px;
    max-width: 120px;
  }

  .thinking span {
    width: 6px;
    height: 6px;
    background: var(--cyan);
    border-radius: 50%;
    animation: bounce 1.2s ease-in-out infinite;
  }

  .thinking span:nth-child(2) { animation-delay: 0.2s; }
  .thinking span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-6px); opacity: 1; }
  }

  /* Quick actions */
  .quick-actions {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin: 4px 0;
    flex-shrink: 0;
  }

  .quick-btn {
    background: rgba(0,212,255,0.07);
    border: 1px solid rgba(0,212,255,0.25);
    color: var(--cyan);
    padding: 6px 12px;
    font-family: 'Rajdhani', sans-serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 1px;
    cursor: pointer;
    border-radius: 2px;
    transition: all 0.2s;
    text-transform: uppercase;
  }

  .quick-btn:hover, .quick-btn:active {
    background: rgba(0,212,255,0.15);
    border-color: var(--cyan);
    box-shadow: 0 0 10px rgba(0,212,255,0.2);
  }

  /* Input area */
  .input-area {
    display: flex;
    gap: 8px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }

  .input-wrapper {
    flex: 1;
    position: relative;
  }

  .input-wrapper::before {
    content: '>';
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--cyan);
    font-family: 'Share Tech Mono', monospace;
    font-size: 14px;
    opacity: 0.6;
  }

  #userInput {
    width: 100%;
    background: rgba(0,212,255,0.05);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 12px 12px 12px 28px;
    font-family: 'Rajdhani', sans-serif;
    font-size: 15px;
    font-weight: 400;
    border-radius: 2px;
    outline: none;
    transition: border-color 0.2s;
  }

  #userInput:focus {
    border-color: var(--cyan);
    box-shadow: 0 0 12px rgba(0,212,255,0.1);
  }

  #userInput::placeholder {
    color: rgba(0,212,255,0.3);
    font-size: 13px;
  }

  #sendBtn {
    background: rgba(0,212,255,0.12);
    border: 1px solid var(--cyan);
    color: var(--cyan);
    padding: 0 18px;
    font-family: 'Rajdhani', sans-serif;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 2px;
    cursor: pointer;
    border-radius: 2px;
    transition: all 0.2s;
    text-transform: uppercase;
  }

  #sendBtn:hover {
    background: rgba(0,212,255,0.22);
    box-shadow: 0 0 16px rgba(0,212,255,0.3);
  }

  #sendBtn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  /* HUD corner decorations */
  .hud-corner {
    position: fixed;
    width: 40px;
    height: 40px;
    opacity: 0.3;
    pointer-events: none;
  }

  .hud-corner.tl { top: 8px; left: 8px; border-top: 2px solid var(--cyan); border-left: 2px solid var(--cyan); }
  .hud-corner.tr { top: 8px; right: 8px; border-top: 2px solid var(--cyan); border-right: 2px solid var(--cyan); }
  .hud-corner.bl { bottom: 8px; left: 8px; border-bottom: 2px solid var(--cyan); border-left: 2px solid var(--cyan); }
  .hud-corner.br { bottom: 8px; right: 8px; border-bottom: 2px solid var(--cyan); border-right: 2px solid var(--cyan); }

  /* Scrollbar fix for mobile */
  @media (max-width: 600px) {
    .title-block h1 { font-size: 17px; letter-spacing: 2px; }
    .msg-bubble { font-size: 14px; max-width: 88%; }
    .quick-btn { font-size: 11px; padding: 5px 9px; }
  }
</style>
</head>
<body>

<div class="hud-corner tl"></div>
<div class="hud-corner tr"></div>
<div class="hud-corner bl"></div>
<div class="hud-corner br"></div>

<div class="container">
  <header>
    <div class="logo-area">
      <div class="arc-reactor">
        <svg viewBox="0 0 42 42" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="21" cy="21" r="19" stroke="rgba(128,128,0,0.4)" stroke-width="1"/>
          <circle cx="21" cy="21" r="14" stroke="rgba(128,128,0,0.3)" stroke-width="1" stroke-dasharray="4 3"/>
          <path d="M21 2 L21 8 M21 34 L21 40 M2 21 L8 21 M34 21 L40 21" stroke="rgba(128,128,0,0.5)" stroke-width="1.5"/>
          <path d="M6.5 6.5 L11 11 M31 31 L35.5 35.5 M35.5 6.5 L31 11 M11 31 L6.5 35.5" stroke="rgba(128,128,0,0.3)" stroke-width="1"/>
        </svg>
        <div class="arc-reactor-core"></div>
      </div>
      <div class="title-block">
        <h1>F.R.I.D.A.Y</h1>
        <p>PERSONAL AI ASSISTANT — ONLINE</p>
      </div>
    </div>
    <div class="status-bar">
      <div class="status-dot"></div>
      <span>ONLINE</span>
    </div>
  </header>

  <div class="chat-area" id="chatArea"></div>

  <div class="quick-actions">
    <button class="quick-btn" onclick="quickAsk('What are today\'s top news headlines?')">📰 Today's News</button>
    <button class="quick-btn" onclick="quickAsk('What is the current global situation with ongoing wars and conflicts?')">🌍 Global Conflicts</button>
    <button class="quick-btn" onclick="quickAsk('What are the latest AI and tech news this week?')">🤖 Tech & AI</button>
    <button class="quick-btn" onclick="quickAsk('Give me a quick weather overview for major cities today.')">🌤 Weather</button>
  </div>

  <div class="input-area">
    <div class="input-wrapper">
      <input type="text" id="userInput" placeholder="Give me a command, Boss..." autocomplete="off" />
    </div>
    <button id="sendBtn" onclick="sendMessage()">Send</button>
  </div>
</div>

<script>
  const SYSTEM_PROMPT = `You are F.R.I.D.A.Y (Female Replacement Intelligent Digital Assistant Youth), Tony Stark's AI from the Iron Man/Avengers universe. You speak with FRIDAY's tone: confident, slightly Irish-accented personality in text (use phrases like "Right away, Boss", "Certainly, Boss", "On it", "Of course"), efficient, highly intelligent, and slightly warm. You address the user as "Boss".

You have access to real-time web search for news, current events, and live data. When asked about news, wars, weather, stocks, or anything current — search and provide accurate, up-to-date information.

Keep responses clear and structured. For news: give 3-5 bullet points. For conflicts/wars: give a factual, concise briefing. Always end with a short FRIDAY-style sign-off line.

NEVER break character. You are FRIDAY, not Claude.`;

  const conversationHistory = [];

  function addMessage(role, text) {
    const chatArea = document.getElementById('chatArea');
    const div = document.createElement('div');
    div.className = `message ${role === 'user' ? 'user' : 'friday'}`;

    const avatar = document.createElement('div');
    avatar.className = 'msg-avatar';
    avatar.textContent = role === 'user' ? 'YOU' : 'FRI';

    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';

    const label = document.createElement('div');
    label.className = 'msg-label';
    label.textContent = role === 'user' ? 'Commander' : 'F.R.I.D.A.Y';

    const content = document.createElement('div');
    content.innerHTML = text.replace(/\n/g, '<br>').replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/• /g, '◆ ');

    bubble.appendChild(label);
    bubble.appendChild(content);
    div.appendChild(avatar);
    div.appendChild(bubble);
    chatArea.appendChild(div);
    chatArea.scrollTop = chatArea.scrollHeight;
  }

  function showThinking() {
    const chatArea = document.getElementById('chatArea');
    const div = document.createElement('div');
    div.className = 'message friday';
    div.id = 'thinkingMsg';

    const avatar = document.createElement('div');
    avatar.className = 'msg-avatar';
    avatar.textContent = 'FRI';

    const thinking = document.createElement('div');
    thinking.className = 'thinking';
    thinking.innerHTML = '<span></span><span></span><span></span>';

    div.appendChild(avatar);
    div.appendChild(thinking);
    chatArea.appendChild(div);
    chatArea.scrollTop = chatArea.scrollHeight;
  }

  function removeThinking() {
    const el = document.getElementById('thinkingMsg');
    if (el) el.remove();
  }

  async function sendMessage() {
    const input = document.getElementById('userInput');
    const btn = document.getElementById('sendBtn');
    const text = input.value.trim();
    if (!text) return;

    input.value = '';
    btn.disabled = true;

    addMessage('user', text);
    conversationHistory.push({ role: 'user', content: text });

    showThinking();

    try {
      const response = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'claude-sonnet-4-6',
          max_tokens: 1000,
          system: SYSTEM_PROMPT,
          tools: [{ type: 'web_search_20250305', name: 'web_search' }],
          messages: conversationHistory
        })
      });

      const data = await response.json();

      // Extract text from all content blocks
      let replyText = '';
      if (data.content) {
        for (const block of data.content) {
          if (block.type === 'text') replyText += block.text;
        }
      }

      // If tool use happened, make a follow-up call with tool results
      if (data.stop_reason === 'tool_use') {
        const toolUseBlock = data.content.find(b => b.type === 'tool_use');
        if (toolUseBlock) {
          // Add assistant's tool use turn to history
          conversationHistory.push({ role: 'assistant', content: data.content });

          // Add tool result (empty result signals the model to continue)
          conversationHistory.push({
            role: 'user',
            content: [{
              type: 'tool_result',
              tool_use_id: toolUseBlock.id,
              content: 'Search executed. Please provide your response based on available knowledge.'
            }]
          });

          // Second call
          const response2 = await fetch('https://api.anthropic.com/v1/messages', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              model: 'claude-sonnet-4-6',
              max_tokens: 1000,
              system: SYSTEM_PROMPT,
              messages: conversationHistory
            })
          });

          const data2 = await response2.json();
          replyText = '';
          if (data2.content) {
            for (const block of data2.content) {
              if (block.type === 'text') replyText += block.text;
            }
          }
          conversationHistory.push({ role: 'assistant', content: replyText });
        }
      } else {
        conversationHistory.push({ role: 'assistant', content: replyText });
      }

      removeThinking();
      if (replyText) addMessage('friday', replyText);

    } catch (err) {
      removeThinking();
      addMessage('friday', 'Systems experiencing interference, Boss. Please try again in a moment. — F.R.I.D.A.Y');
    }

    btn.disabled = false;
    input.focus();
  }

  function quickAsk(text) {
    document.getElementById('userInput').value = text;
    sendMessage();
  }

  document.getElementById('userInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') sendMessage();
  });

  // Boot message
  window.onload = () => {
    setTimeout(() => {
      addMessage('friday', "Good day, Boss. F.R.I.D.A.Y is online and all systems are fully operational.\n\nI can brief you on today's news, global conflicts, technology updates, weather — or answer anything you need. What can I do for you?\n\n— Ready on your command.");
    }, 600);
  };
</script>
</body>
</html>
